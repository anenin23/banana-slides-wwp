version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: banana-slides-backend
    ports:
      # 将宿主机端口 5000 改为 5007
      - "5007:5000"
    environment:
      # 方案 B：设置群晖用户权限环境变量
      - PUID=1026
      - PGID=100
      - PORT=5000
      # 代理设置：让后端能通过你的代理访问 AI 接口
      - HTTP_PROXY=http://192.168.50.245:7890
      - HTTPS_PROXY=http://192.168.50.245:7890
      - http_proxy=http://192.168.50.245:7890
      - https_proxy=http://192.168.50.245:7890
      - NO_PROXY=localhost,127.0.0.1,banana-slides-network
    env_file:
      - .env
    volumes:
      # 使用你提供的绝对路径
      - /volume2/docker/banana-slides/backend/instance:/app/backend/instance
      - /volume2/docker/banana-slides/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - banana-slides-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        DOCKER_BUILDKIT: 1
        # 极其重要：前端编译时必须指定浏览器访问后端的真实地址（NAS IP + 新端口）
        VITE_API_BASE_URL: http://192.168.50.245:5007
    container_name: banana-slides-frontend
    environment:
      - PUID=1026
      - PGID=100
    ports:
      # 将宿主机端口 3000 改为 3007
      - "3007:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - banana-slides-network

networks:
  banana-slides-network:
    driver: bridge

