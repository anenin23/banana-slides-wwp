version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: banana-slides-backend
    # 权限设置：UID 100, GID 1026
    user: "100:1026"
    ports:
      # 宿主机端口改为 5007，容器内部默认监听 5000
      - "5007:5000"
    environment:
      - PORT=5000
      # 代理设置：指向你的 NAS 代理地址
      - HTTP_PROXY=http://192.168.50.245:7890
      - HTTPS_PROXY=http://192.168.50.245:7890
      - http_proxy=http://192.168.50.245:7890
      - https_proxy=http://192.168.50.245:7890
    env_file:
      - .env
    volumes:
      # 请确保这些文件夹在 /volume2/docker/banana-slides 下已手动创建
      - /volume2/docker/banana-slides/backend/instance:/app/backend/instance
      - /volume2/docker/banana-slides/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - banana-slides-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        DOCKER_BUILDKIT: 1
        # 核心：前端构建时必须知道后端的外网访问地址
        VITE_API_BASE_URL: http://192.168.50.245:5007
    container_name: banana-slides-frontend
    user: "100:1026"
    ports:
      # 宿主机端口改为 3007
      - "3007:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - banana-slides-network

networks:
  banana-slides-network:
    driver: bridge

